<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Fact Check</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h1>Fact Check</h1>
  <p class="subtitle">Paste text or select it on the page and right-click.</p>
  <textarea id="input" placeholder="Paste a sentence or paragraph to verify…"></textarea>
  <div class="actions">
    <button id="run">Verify</button>
    <span class="status" id="status"></span>
  </div>
  <div id="results"></div>
  <script src="popup.js"></script>
</body>
</html>
